name: Release and Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release-publish:
    name: Build, Release to GitHub, and Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Release & uploading release assets
      id-token: write # Required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution packages
        run: python -m build

      - name: Validate distribution packages
        run: twine check dist/*

      - name: Extract package version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.tag }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
